name: Save GitHub Traffic History

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect traffic history
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          token = os.environ.get("TRAFFIC_TOKEN")
          if not token:
              raise SystemExit("Missing repository secret TRAFFIC_TOKEN")
          repo = os.environ["REPOSITORY"]
          path = Path("statistics/traffic.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          columns = ["date", "clones", "unique_cloners", "views", "unique_visitors"]
          history = {}

          if path.exists():
              with path.open(newline="", encoding="utf-8") as file:
                  history = {row["date"]: row for row in csv.DictReader(file)}

          for metric, count_field, unique_field in (
              ("clones", "clones", "unique_cloners"),
              ("views", "views", "unique_visitors"),
          ):
              request = Request(
                  f"https://api.github.com/repos/{repo}/traffic/{metric}?per=day",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  records = json.load(response)[metric]
              for item in records:
                  date = item["timestamp"][:10]
                  row = history.setdefault(date, {"date": date, **{key: "" for key in columns[1:]}})
                  row[count_field] = str(item["count"])
                  row[unique_field] = str(item["uniques"])

          with path.open("w", newline="", encoding="utf-8") as file:
              writer = csv.DictWriter(file, fieldnames=columns)
              writer.writeheader()
              writer.writerows(history[day] for day in sorted(history))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statistics/traffic.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily GitHub traffic history"
            git push
          fi
