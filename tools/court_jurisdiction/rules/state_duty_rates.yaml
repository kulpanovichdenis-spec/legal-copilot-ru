# Обособленные банкротные споры (АПК) — 50% суммы пп.8 п.1 ст.333.21,
# "исходя из существа заявленных требований" (закон не даёт формулу свёртки
# существа требования в конкретную сумму — калькулятор возвращает базу для
# расчёта 50%, само существо требования оценивает юрист/агент).
bankruptcy_incidental_dispute:
  APK:
    - rule_id: NK_333_21_BANKRUPTCY_INCIDENTAL_2024
      effective_from: "2024-09-08"
      effective_to: null
      confidence: verified_fulltext
      source: "НК РФ ст. 333.21 п. 1 пп. 9 — 50% пошлины по пп. 8 п. 1, исходя из существа заявленных требований"
      last_verified: "2026-09-16"
      percent_of: bankruptcy_petition
      percent: 50
      note: "'исходя из существа заявленных требований' — сумма базы (10000/100000) может отличаться от заявления о банкротстве в зависимости от квалификации обособленного спора; определяет юрист, калькулятор не домысливает."
