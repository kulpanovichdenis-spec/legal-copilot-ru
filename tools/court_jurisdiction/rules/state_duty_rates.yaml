# Версионированные ставки государственной пошлины.
# Каждое versioned-правило — отдельный rule_id с effective_from/effective_to и source.
# Изменение ставки НЕ переписывает старое правило — добавляется новая запись
# с новым effective_from, старая получает effective_to (ТЗ §95).
#
# confidence:
#   verified_fulltext — сверено дословно по официальному тексту НК РФ,
#                        полученному с pravo.gov.ru (nd=102067058) через
#                        протокол references/pravo-gov-ru-search-protocol.md,
#                        2026-09-16. Можно выдавать как PAYABLE.
#   search_synthesis   — получено через агрегированный ответ поисковика,
#                        НЕ сверено дословно. Выдаётся как оценка с
#                        MANUAL_REVIEW_REQUIRED, не PAYABLE.
#
# 2026-09-16 — правки после прямой сверки с pravo.gov.ru: часть значений,
# ранее закодированных как search_synthesis (WebSearch по Гарант/Консультант),
# оказалась НЕТОЧНОЙ при сверке с официальным текстом (например, оспаривание
# ненормативного акта — было 300/2000, реально 3000/15000 руб.; "трудовая
# льгота" в ст. 333.37 НК РФ для арбитража вообще не существует — выдумана
# по аналогии с ГПК). Это подтверждает правило: search_synthesis никогда не
# выдаётся как PAYABLE/EXEMPT без дословной проверки — см. [[npa-lookup-official-tools-not-web]].

