# Версионированные льготы/освобождения от госпошлины — ст. 333.36 НК РФ (СОЮ/
# мировые) и ст. 333.37 НК РФ (арбитраж). Все записи ниже сверены дословно
# 2026-09-16 по официальному тексту с pravo.gov.ru (nd=102067058) — см.
# tools/court_jurisdiction/rules/state_duty_rates.yaml, source_doc.
#
# Это НЕ исчерпывающий список — ст. 333.36 п.1 содержит ~26 подпунктов (и
# продолжает дополняться, последнее на дату сверки — пп.26 от 20.02.2026
# № 40-ФЗ), закодированы наиболее частые в практике in-house категории.
# Незакодированный код -> UNKNOWN_CODE, не считается отсутствием льготы
# (ТЗ §68: льготы — не статический список).
#
# 2026-09-16 — исправление после сверки: ранее "consumer_claims" был указан
# как п.1 пп.4 ст.333.36 (полная льгота) — ОШИБКА. Реальная структура: полная
# льгота по потребительским искам в п.1 нет вообще; льгота по потребительским
# искам — п.2 пп.4, и она НЕ полная, а с порогом по цене иска 1 000 000 руб.
# (правило порога — общее п.3 для ВСЕХ категорий п.2, не только потребителей).
# Ранее закодированная АПК "labor_claims" — ПОЛНОСТЬЮ ВЫДУМАНА (в ст.333.37
# такой льготы нет вообще) — удалена, заменена реальными категориями.

