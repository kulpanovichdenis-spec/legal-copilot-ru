  label: change_of_control
  type: text
  material: false
- field_id: assignment
  label: assignment
  type: text
  material: false
- field_id: termination
  label: termination
  type: text
  material: false
- field_id: cross_default
  label: cross_default
  type: text
  material: false
- field_id: exclusivity
  label: exclusivity
  type: text
  material: false
- field_id: non_compete
  label: non_compete
  type: text
  material: false
- field_id: preemption
  label: preemption
  type: text
  material: false
- field_id: penalties_or_indemnities
  label: penalties_or_indemnities
