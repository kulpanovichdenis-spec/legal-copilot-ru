id: EXT-SH-204
title: Material commercial contract risk extractor
document_types:
- commercial_agreement
- loan
- security
- supply
- customer_agreement
- JV_agreement
mapped_checks:
- SH-013
fields:
- parties
- term
- value_or_materiality
- change_of_control
- assignment
- termination
- cross_default
- exclusivity
- non_compete
- preemption
- penalties_or_indemnities
- security
- related_party
- off_market_indicators
human_review_required: true
rules:
- Extract facts with exact locator.
- Do not make final employment/property/IT legal conclusions.
output_contract: schemas/typed_fact.yaml
project_calibration:
  mode: adaptive
  config: runtime/calibration.yaml
  required_only_when_triggered: true
field_definitions:
- field_id: parties
  label: parties
  type: text
  material: false
- field_id: term
  label: term
  type: text
  material: false
