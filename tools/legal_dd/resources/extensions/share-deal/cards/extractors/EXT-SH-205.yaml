id: EXT-SH-205
title: Insurance extractor
document_types:
- insurance_policy
- insurance_agreement
- insurance_claim
mapped_checks:
- SH-014
fields:
- insurer
- insured
- coverage
- limit
- term
- deductible
- mandatory_or_voluntary
- material_exclusions
- claims_or_disputes
human_review_required: true
rules:
- Extract facts with exact locator.
- Do not make final employment/property/IT legal conclusions.
output_contract: schemas/typed_fact.yaml
project_calibration:
  mode: adaptive
  config: runtime/calibration.yaml
  required_only_when_triggered: true
field_definitions:
- field_id: insurer
  label: insurer
  type: entity_ref
  material: false
- field_id: insured
  label: insured
  type: entity_ref
  material: false
- field_id: coverage
  label: coverage
  type: text
  material: false
- field_id: limit
  label: limit
  type: currency
  material: false
- field_id: term
  label: term
  type: text
  material: false
- field_id: deductible
  label: deductible
  type: text
  material: false
- field_id: mandatory_or_voluntary
  label: mandatory_or_voluntary
  type: text
  material: false
- field_id: material_exclusions
  label: material_exclusions
  type: text
  material: false
- field_id: claims_or_disputes
  label: claims_or_disputes
  type: text
  material: false
role: extraction_capability
selection_policy: Run only when this capability can establish unresolved facts needed by active Evidence Requirements/checks, or when wider batch
  extraction is demonstrably efficient.
do_not_extract_all_fields_by_default: true
fnm:
  purpose: Transform relevant source content into typed, provenance-bearing facts required by unresolved legal/transaction questions.
  failure_modes:
  - summary without required fact
  - over-extraction as ritual
  - legal conclusion made by extractor
  - fact without quote/locator
  required_invariant: Any material answered fact emitted by extractor has typed value/state, quote and exact locator; extractor does not certify
    legal conclusion.
  constraint_type: INVARIANT
  ai_native_implementation:
  - goal-conditioned field selection
  - parallel extraction where useful
  - typed schema
  - provenance validator
  validator:
  - VAL-FACT-PROVENANCE
  eval: Required material field is extracted with exact locator; irrelevant schema fields need not be populated.
