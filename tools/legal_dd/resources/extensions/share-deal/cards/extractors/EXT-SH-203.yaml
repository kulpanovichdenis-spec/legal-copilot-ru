id: EXT-SH-203
title: IT / software rights extractor
document_types:
- software_inventory
- software_licence
- IT_services_agreement
- software_development_agreement
- infrastructure_title_document
mapped_checks:
- SH-011
fields:
- software_or_system
- provider
- licence_scope
- term
- users_or_sites
- assignment_or_change_control
- internally_developed_rights
- critical_dependency
- planned_capex
human_review_required: true
rules:
- Extract facts with exact locator.
- Do not make final employment/property/IT legal conclusions.
output_contract: schemas/typed_fact.yaml
project_calibration:
  mode: adaptive
  config: runtime/calibration.yaml
  required_only_when_triggered: true
field_definitions:
- field_id: software_or_system
  label: software_or_system
  type: asset_ref
  material: false
- field_id: provider
  label: provider
  type: entity_ref
  material: false
- field_id: licence_scope
  label: licence_scope
  type: text
  material: false
- field_id: term
  label: term
  type: text
  material: false
- field_id: users_or_sites
  label: users_or_sites
  type: entity_ref
  material: false
- field_id: assignment_or_change_control
  label: assignment_or_change_control
  type: text
  material: false
- field_id: internally_developed_rights
  label: internally_developed_rights
  type: text
  material: false
- field_id: critical_dependency
  label: critical_dependency
  type: text
  material: false
- field_id: planned_capex
  label: planned_capex
  type: text
  material: false
role: extraction_capability
selection_policy: Run only when this capability can establish unresolved facts needed by active Evidence Requirements/checks, or when wider batch
  extraction is demonstrably efficient.
do_not_extract_all_fields_by_default: true
fnm:
  purpose: Transform relevant source content into typed, provenance-bearing facts required by unresolved legal/transaction questions.
  failure_modes:
  - summary without required fact
  - over-extraction as ritual
  - legal conclusion made by extractor
  - fact without quote/locator
  required_invariant: Any material answered fact emitted by extractor has typed value/state, quote and exact locator; extractor does not certify
    legal conclusion.
  constraint_type: INVARIANT
  ai_native_implementation:
  - goal-conditioned field selection
  - parallel extraction where useful
  - typed schema
  - provenance validator
  validator:
  - VAL-FACT-PROVENANCE
  eval: Required material field is extracted with exact locator; irrelevant schema fields need not be populated.
