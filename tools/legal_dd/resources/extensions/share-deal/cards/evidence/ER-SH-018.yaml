evidence_types:
- staffing_table
- org_chart
- management_employment
- employment_templates
- foreign_workers
- bonus_policies
- LTIP
- pension_programs
- employee_loans
- wage_arrears
- union_documents
- collective_agreements
- employee_insurance
- social_benefits
- individual_service_agreements
- personnel_supply
- redundancies
- accidents
- strikes
- employee_disputes
sufficient_if:
- material workforce structure, employment terms, incentives, foreign workers, collective/union matters, social obligations and material employee
