id: ER-SH-012
title: Лицензии, проверки, таможня, антимонопольные, валютные и compliance-вопросы
mapped_checks: &id001
- SH-012
requested_from: target/seller
review_scope:
  mode: risk_based
evidence_types:
- licences_and_permits
- expired_or_missing_permits
- permit_violations
- authority_orders
- inspection_list
- customs_documents
- antitrust_inspections
- antitrust_approvals
- market_share_information
- FX_violations
- FX_correspondence
- compliance_policies
- anti_corruption_incidents
- sanctions_confirmation
- strategic_investment_information
- certificates
- tax_or_other_benefits
sufficient_if:
- material regulatory licences, inspections, customs/antitrust/FX/compliance matters and open obligations are disclosed for the applicable scope
  and period
request_text: Предоставить лицензии/разрешения, сведения о проверках и предписаниях, существенных таможенных и антимонопольных вопросах, валютных
  нарушениях, compliance/anti-corruption/sanctions и иных специальных режимах.
source_items:
- 12.1–12.22
extractor_ids:
- EXT-LIC-120
- EXT-RISK-090
- EXT-COMP-092
- EXT-APP-091
request_phase: initial
activation_checks: *id001
title_en: Licences, inspections, customs, antitrust, FX and compliance
title_ru: Лицензии, проверки, таможня, антимонопольные, валютные и compliance-вопросы
role: evidence_sufficiency_contract
evidence_types_are_examples: true
functional_equivalent_evidence_allowed: true
request_only_if_unresolved: true
fnm:
  purpose: Establish the facts needed to resolve linked coverage obligations; obtaining a specifically named document is not the objective unless
    law/transaction makes form/source mandatory.
  failure_modes:
  - document-name ritual without required facts
  - file presence treated as sufficiency
  - equivalent reliable evidence ignored
  - gap silently converted to clear
  required_invariant: Requirement is satisfied only when its sufficiency rule is met with traceable evidence; otherwise status remains explicit.
  constraint_type: INVARIANT
  ai_native_implementation:
  - fact-oriented sufficiency rule
  - many-to-many evidence graph
  - dynamic request/gap generation
  validator:
  - VAL-EVIDENCE-SUFFICIENCY
  - VAL-FACT-PROVENANCE
  eval: Equivalent evidence may satisfy the functional fact requirement; missing material fact may not.
