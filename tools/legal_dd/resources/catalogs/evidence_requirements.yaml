version: '1.2'
title: Legal DD Evidence Requirements Catalog
principles:
  source_of_truth: project state, not request list or HTML
  base_classifier: EXT-GEN-001 runs for every document/item
  document_requirement_is_not_check: true
  one_requirement_can_support_multiple_checks: true
  one_document_can_satisfy_multiple_requirements: true
  human_confirmation_required: true
  missing_information_is_not_clear: true
  exact_locator_required_for_material_fact: true
status_model:
- not_requested
- requested
- received
- partially_satisfied
- satisfied
- invalid
- outdated
- not_applicable
- unavailable
- external_source
requirements:
- id: ER-TX-001
  title: Term sheet / согласованная структура сделки
  module: transaction
  applies_when: Always, if term sheet or agreed structure exists
  requested_from: buyer_team/seller
  evidence_types:
  - term_sheet
  - heads_of_terms
  - deal_memo
  - email_confirmation
  sufficient_if:
  - parties, transaction type, assets, transfer model and principal commercial structure are identifiable; unresolved points are explicitly marked
  mapped_checks:
  - TX-001
  - TX-003
  - TX-004
  - TX-007
  extractor_ids:
  - EXT-GEN-001
  - EXT-CON-010
  request_text: Предоставить term sheet / heads of terms / согласованное описание структуры сделки и все актуальные изменения к нему.
  gap_text: Отсутствует или не позволяет достоверно определить структуру сделки; требуется подтверждение transaction perimeter.
  external_verification: false
  derived_requirement: false
  freshness: null
  notes: null
  human_confirmation_required: true
  review_scope:
    mode: exhaustive
  activation_checks:
  - TX-001
  - TX-003
  - TX-004
  - TX-007
  request_phase: initial
  title_en: Transaction term sheet / agreed structure
  title_ru: Term sheet / согласованная структура сделки
  role: evidence_sufficiency_contract
  evidence_types_are_examples: true
  functional_equivalent_evidence_allowed: true
  request_only_if_unresolved: true
  fnm:
    purpose: Establish the facts needed to resolve linked coverage obligations; obtaining a specifically named document is not the objective unless
      law/transaction makes form/source mandatory.
    failure_modes:
    - document-name ritual without required facts
    - file presence treated as sufficiency
    - equivalent reliable evidence ignored
    - gap silently converted to clear
    required_invariant: Requirement is satisfied only when its sufficiency rule is met with traceable evidence; otherwise status remains explicit.
    constraint_type: INVARIANT
    ai_native_implementation:
    - fact-oriented sufficiency rule
    - many-to-many evidence graph
    - dynamic request/gap generation
    validator:
    - VAL-EVIDENCE-SUFFICIENCY
    - VAL-FACT-PROVENANCE
    eval: Equivalent evidence may satisfy the functional fact requirement; missing material fact may not.
