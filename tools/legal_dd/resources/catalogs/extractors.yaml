  - Agreement
  - Party
  - Person
  - Asset
  - Right
  - Approval
  - Payment
  facts_to_extract:
  - agreement type/title/number/date/place
  - parties and roles
  - signatories and authority basis
  - governing law
  - subject matter
  - essential terms stated in the document
  - asset/product identifiers and schedules where listed
  - scope/type of right
  - territory
  - term
  - exclusivity
  - restrictions
  - retained rights
  - conditions precedent/effective date
  - consideration and payment mechanics
  - moment/mechanism of transfer of right
  - acceptance/transfer act requirement
  - registration/recordal requirement
  - third-party consent requirement
  - corporate approval references
  - representations/warranties on title and authority
  - termination rights
  - annexes/addenda referenced
  - performance documents referenced
  mapped_checks:
  - TX-003
  - TX-006
  - TX-007
  - IP-DOC-001
  - IP-DOC-002
  - IP-KH-003
  - IP-TM-004
  - IP-PAT-006
  - IP-CR-008
  - IP-DOM-010
  - IP-WEB-011
  - IP-ENC-012
  - CORP-003
  - CORP-005
  - CORP-006
  - CORP-007
  - CLS-002
  critical_fields:
  - parties
  - signatories
  - subject_matter
  - asset_identifiers
  - right_scope
  - transfer_moment
  - payment_condition
  - registration_requirement
  human_review_questions:
  - Идентифицирован ли наш объект сделки прямо или через приложение?
  - Какие факты подтверждают заключенность; каких фактов не хватает?
  - Какие факты релевантны действительности/оспоримости, но требуют отдельного legal check?
  - Возникло/перешло ли право к нашему контрагенту согласно тексту и при каких условиях?
  - Какие approvals/consents прямо требуются или упомянуты?
  - Что еще требуется для подтверждения надлежащего исполнения?
  fail_safe: Never state 'contract is valid/concluded/performed'. Extract facts only; missing annex/payment/act/registration must create a gap.
  human_review_required: true
  output_contract: schemas/typed_fact.yaml
  project_calibration:
    mode: adaptive
    config: runtime/calibration.yaml
    required_only_when_triggered: true
