id: EXT-MFG-073
title: Suppliers / materials / specifications extractor
document_types:
- supplier_list
- supplier_qualification
- material_specification
- raw_material_contract
- packaging_material_specification
purposes:
- identify_critical_suppliers
- support_supply_continuity
- support_quality_assessment
entities:
- Party
- Product
- Site
- Agreement
facts_to_extract:
- supplier
- material
- status/qualification
- specification/version
- sole-source indicator
- contract term
- minimum order/lead time if present
- change-control obligations
- termination
- site/product linkage
mapped_checks:
- MFG-006
- MFG-009
- REG-009
critical_fields:
- supplier
- material
- qualification_status
- contract_term
human_review_questions:
- Есть ли single-source/critical suppliers?
- Какие договоры нужно transfer/replace?
- Совпадают ли specs с current dossier?
fail_safe: Do not infer supplier continuity from a supplier list without current contract/status evidence.
human_review_required: true
output_contract: schemas/typed_fact.yaml
project_calibration:
  mode: adaptive
  config: runtime/calibration.yaml
  required_only_when_triggered: true
field_definitions:
- field_id: supplier
  label: supplier
  type: entity_ref
  material: true
- field_id: material
  label: material
  type: text
  material: true
- field_id: status_qualification
  label: status/qualification
  type: enum
  material: false
- field_id: specification_version
  label: specification/version
  type: text
  material: false
- field_id: sole_source_indicator
  label: sole-source indicator
  type: text
  material: false
- field_id: contract_term
  label: contract term
  type: text
  material: true
- field_id: minimum_order_lead_time_if_present
  label: minimum order/lead time if present
  type: text
  material: false
- field_id: change_control_obligations
  label: change-control obligations
  type: text
  material: false
- field_id: termination
  label: termination
  type: text
  material: false
- field_id: site_product_linkage
  label: site/product linkage
  type: asset_ref
  material: false
role: extraction_capability
selection_policy: Run only when this capability can establish unresolved facts needed by active Evidence Requirements/checks, or when wider batch
  extraction is demonstrably efficient.
do_not_extract_all_fields_by_default: true
fnm:
  purpose: Transform relevant source content into typed, provenance-bearing facts required by unresolved legal/transaction questions.
  failure_modes:
  - summary without required fact
  - over-extraction as ritual
  - legal conclusion made by extractor
  - fact without quote/locator
  required_invariant: Any material answered fact emitted by extractor has typed value/state, quote and exact locator; extractor does not certify
    legal conclusion.
  constraint_type: INVARIANT
  ai_native_implementation:
  - goal-conditioned field selection
  - parallel extraction where useful
  - typed schema
  - provenance validator
  validator:
  - VAL-FACT-PROVENANCE
  eval: Required material field is extracted with exact locator; irrelevant schema fields need not be populated.
