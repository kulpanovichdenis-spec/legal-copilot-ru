id: EXT-SHARE-110
title: Share / participation interest title extractor
document_types:
- share_register_extract
- depo_statement
- share_purchase_agreement
- interest_transfer_agreement
- share_pledge
- corporate_agreement
purposes:
- confirm_share_title
- identify_share_encumbrances
- support_share_deal
entities:
- Party
- Person
- Agreement
- Right
facts_to_extract:
- owner
- share/interest percentage
- class/number if applicable
- acquisition basis
- transfer date
- payment/registration requirements
- pledges/encumbrances
- pre-emption rights
- options
- corporate agreement restrictions
mapped_checks:
- TX-001
- TX-005
- CORP-007
- APP-001
- APP-003
critical_fields:
- owner
- percentage
- acquisition_basis
- encumbrances
human_review_questions:
- Подтверждена ли непрерывная цепочка владения?
- Есть ли ограничения/преимущественные права?
- Какие approvals нужны?
fail_safe: Use only when share/mixed deal module is enabled.
human_review_required: true
output_contract: schemas/typed_fact.yaml
project_calibration:
  mode: adaptive
  config: runtime/calibration.yaml
  required_only_when_triggered: true
field_definitions:
- field_id: owner
  label: owner
  type: entity_ref
  material: true
- field_id: share_interest_percentage
  label: share/interest percentage
  type: number
  material: true
- field_id: class_number_if_applicable
  label: class/number if applicable
  type: number
  material: false
- field_id: acquisition_basis
  label: acquisition basis
  type: text
  material: true
- field_id: transfer_date
  label: transfer date
  type: date
  material: false
- field_id: payment_registration_requirements
  label: payment/registration requirements
  type: text
  material: false
- field_id: pledges_encumbrances
  label: pledges/encumbrances
  type: text
  material: true
- field_id: pre_emption_rights
  label: pre-emption rights
  type: text
  material: false
- field_id: options
  label: options
  type: text
  material: false
- field_id: corporate_agreement_restrictions
  label: corporate agreement restrictions
  type: text
  material: false
role: extraction_capability
selection_policy: Run only when this capability can establish unresolved facts needed by active Evidence Requirements/checks, or when wider batch
  extraction is demonstrably efficient.
do_not_extract_all_fields_by_default: true
fnm:
  purpose: Transform relevant source content into typed, provenance-bearing facts required by unresolved legal/transaction questions.
  failure_modes:
  - summary without required fact
  - over-extraction as ritual
  - legal conclusion made by extractor
  - fact without quote/locator
  required_invariant: Any material answered fact emitted by extractor has typed value/state, quote and exact locator; extractor does not certify
    legal conclusion.
  constraint_type: INVARIANT
  ai_native_implementation:
  - goal-conditioned field selection
  - parallel extraction where useful
  - typed schema
  - provenance validator
  validator:
  - VAL-FACT-PROVENANCE
  eval: Required material field is extracted with exact locator; irrelevant schema fields need not be populated.
