id: EXT-APP-091
title: Government / regulatory approval extractor
document_types:
- FAS_approval
- foreign_investment_approval
- health_authority_approval
- government_consent
- public_owner_consent
purposes:
- confirm_required_approval
- confirm_scope_and_conditions
entities:
- Approval
- Authority
- Party
- Asset
- Agreement
facts_to_extract:
- authority
- applicant
- transaction
- parties
- assets covered
- approval/decision date
- validity period
- conditions/restrictions
- pre/post-closing obligations
- reporting duties
- reference number
mapped_checks:
- APP-001
- APP-003
- APP-004
- APP-005
- CLS-001
critical_fields:
- authority
- transaction_scope
- conditions
- validity
human_review_questions:
- Охватывает ли approval именно нашу сделку?
- Есть ли условия до/после closing?
- Истек ли срок действия?
fail_safe: An approval for a different transaction scope is not sufficient.
human_review_required: true
output_contract: schemas/typed_fact.yaml
project_calibration:
  mode: adaptive
  config: runtime/calibration.yaml
  required_only_when_triggered: true
field_definitions:
- field_id: authority
  label: authority
  type: entity_ref
  material: true
- field_id: applicant
  label: applicant
  type: text
  material: false
- field_id: transaction
  label: transaction
  type: text
  material: true
- field_id: parties
  label: parties
  type: entity_ref
  material: false
- field_id: assets_covered
  label: assets covered
  type: asset_ref
  material: false
- field_id: approval_decision_date
  label: approval/decision date
  type: date
  material: false
- field_id: validity_period
  label: validity period
  type: text
  material: true
- field_id: conditions_restrictions
  label: conditions/restrictions
  type: text
  material: true
- field_id: pre_post_closing_obligations
  label: pre/post-closing obligations
  type: text
  material: false
- field_id: reporting_duties
  label: reporting duties
  type: text
  material: false
- field_id: reference_number
  label: reference number
  type: number
  material: false
role: extraction_capability
selection_policy: Run only when this capability can establish unresolved facts needed by active Evidence Requirements/checks, or when wider batch
  extraction is demonstrably efficient.
do_not_extract_all_fields_by_default: true
fnm:
  purpose: Transform relevant source content into typed, provenance-bearing facts required by unresolved legal/transaction questions.
  failure_modes:
  - summary without required fact
  - over-extraction as ritual
  - legal conclusion made by extractor
  - fact without quote/locator
  required_invariant: Any material answered fact emitted by extractor has typed value/state, quote and exact locator; extractor does not certify
    legal conclusion.
  constraint_type: INVARIANT
  ai_native_implementation:
  - goal-conditioned field selection
  - parallel extraction where useful
  - typed schema
  - provenance validator
  validator:
  - VAL-FACT-PROVENANCE
  eval: Required material field is extracted with exact locator; irrelevant schema fields need not be populated.
