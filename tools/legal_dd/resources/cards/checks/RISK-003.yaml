id: RISK-003
title: Регуляторные и качественные нарушения / enforcement
module: risk
version: '0.3'
objective: If material/applicable, 'Регуляторные и качественные нарушения / enforcement' must end as supported proposed/final conclusion, explicit
  issue/gap, external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
applicability_key: regulated_product_or_manufacturing
evidence_requirements:
- ER-REG-011
- ER-MFG-007
- ER-RISK-003
rules:
- Do not set clear while any mandatory evidence requirement is missing, partial, invalid, outdated or conflicting.
- Every material factual proposition must resolve to one or more facts with exact source locators.
- Legal conclusions must cite verified legal authority separately from factual evidence.
outputs:
- finding
- evidence_gaps
- actions
- contract_effect
contract_effect_candidates:
- disclosure
- representations
- indemnity
- conditions_precedent
human_confirmation_required: true
title_en: Regulatory / Quality Enforcement
title_ru: Регуляторные и качественные нарушения / enforcement
role: coverage_obligation
fnm:
  purpose: Resolve whether 'Регуляторные и качественные нарушения / enforcement' is satisfactorily established for the applicable deal perimeter;
    identify material disputes, enforcement or compliance facts that affect value, transferability, continuity or transaction execution.
  failure_modes:
  - material exposure omitted
  - seller statement treated as independent verification
  - risk not linked to transaction consequence
  - silent omission because human checklist order was not followed
  - false clear despite unresolved material evidence
  required_invariant: If material/applicable, 'Регуляторные и качественные нарушения / enforcement' must end as supported proposed/final conclusion,
    explicit issue/gap, external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
  constraint_type: INVARIANT
  hard_if_applicable: false
  ai_native_implementation:
  - risk-based retrieval
  - materiality policy
  - critic on material/adverse/conflicted state
  validators:
  - VAL-DEPTH-ADEQUACY
  - VAL-CONFLICTS
  - VAL-CONSEQUENCE-LINK
  sequence_required: false
  depth: adaptive per runtime/depth_policy.yaml
state_contract:
  agent_status:
  - not_started
  - in_progress
  - clear
  - issue
  - cannot_conclude
  - external_review_required
  - not_applicable
  human_review:
  - pending
  - confirmed
  - modified
  - rejected
  - reconfirmation_required
  final_status_requires_human_confirmation: true
