id: APP-002
title: Группа лиц и данные для пороговых значений
module: approvals
version: '0.3'
objective: If material/applicable, 'Группа лиц и данные для пороговых значений' must end as supported proposed/final conclusion, explicit issue/gap,
  external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
applicability_key: threshold_assessment_required
evidence_requirements:
- ER-CORP-006
- ER-APP-001
- ER-APP-002
rules:
- Do not set clear while any mandatory evidence requirement is missing, partial, invalid, outdated or conflicting.
- Every material factual proposition must resolve to one or more facts with exact source locators.
- Legal conclusions must cite verified legal authority separately from factual evidence.
outputs:
- finding
- evidence_gaps
- actions
- contract_effect
contract_effect_candidates:
- conditions_precedent
- long_stop
- closing_deliverables
human_confirmation_required: true
title_en: Group Structure / Threshold Data
title_ru: Группа лиц и данные для пороговых значений
role: coverage_obligation
fnm:
  purpose: Resolve whether 'Группа лиц и данные для пороговых значений' is satisfactorily established for the applicable deal perimeter; establish
    whether mandatory governmental/competition/special approvals apply and whether they are satisfied.
  failure_modes:
  - mandatory approval omitted
  - wrong threshold/jurisdiction/date
  - approval scope does not cover transaction
  - silent omission because human checklist order was not followed
  - false clear despite unresolved material evidence
  required_invariant: If material/applicable, 'Группа лиц и данные для пороговых значений' must end as supported proposed/final conclusion, explicit
    issue/gap, external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
  constraint_type: INVARIANT
  hard_if_applicable: true
  ai_native_implementation:
  - applicability engine
  - verified current legal rules
  - external authority evidence
  validators:
  - VAL-LEGAL-AUTHORITY
  - VAL-LEGAL-APPLICATION
  - VAL-HUMAN-GATE
  sequence_required: false
  depth: adaptive per runtime/depth_policy.yaml
state_contract:
  agent_status:
  - not_started
  - in_progress
  - clear
  - issue
  - cannot_conclude
  - external_review_required
  - not_applicable
  human_review:
  - pending
  - confirmed
  - modified
  - rejected
  - reconfirmation_required
  final_status_requires_human_confirmation: true
