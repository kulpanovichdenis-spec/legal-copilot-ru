id: MFG-007
title: Отклонения, инспекции и забракованные серии
module: manufacturing
version: '0.3'
objective: If material/applicable, 'Отклонения, инспекции и забракованные серии' must end as supported proposed/final conclusion, explicit issue/gap,
  external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
applicability_key: ongoing_production
evidence_requirements:
- ER-REG-012
- ER-MFG-007
- ER-RISK-003
rules:
- Do not set clear while any mandatory evidence requirement is missing, partial, invalid, outdated or conflicting.
- Every material factual proposition must resolve to one or more facts with exact source locators.
- Legal conclusions must cite verified legal authority separately from factual evidence.
outputs:
- finding
- evidence_gaps
- actions
- contract_effect
contract_effect_candidates:
- supply_or_manufacturing_agreement
- quality_agreement
- tech_transfer
human_confirmation_required: true
title_en: Deviations / Inspections / Rejected Batches
title_ru: Отклонения, инспекции и забракованные серии
role: coverage_obligation
fnm:
  purpose: Resolve whether 'Отклонения, инспекции и забракованные серии' is satisfactorily established for the applicable deal perimeter; establish
    whether manufacturing, quality and supply dependencies support continuity and transition of the product.
  failure_modes:
  - false continuity assumption
  - missing site/quality dependency
  - unrecognized transfer or supply blocker
  - silent omission because human checklist order was not followed
  - false clear despite unresolved material evidence
  required_invariant: If material/applicable, 'Отклонения, инспекции и забракованные серии' must end as supported proposed/final conclusion, explicit
    issue/gap, external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
