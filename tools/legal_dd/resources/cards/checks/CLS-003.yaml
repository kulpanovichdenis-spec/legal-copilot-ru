id: CLS-003
title: Обязательства после закрытия и переходный период
module: closing
version: '0.3'
objective: If material/applicable, 'Обязательства после закрытия и переходный период' must end as supported proposed/final conclusion, explicit
  issue/gap, external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
applicability_key: post_closing_or_transition
evidence_requirements:
- ER-TX-006
- ER-REG-010
- ER-MFG-005
- ER-MFG-008
- ER-MFG-009
- ER-CLS-003
- ER-CLS-004
rules:
- Do not set clear while any mandatory evidence requirement is missing, partial, invalid, outdated or conflicting.
- Every material factual proposition must resolve to one or more facts with exact source locators.
- Legal conclusions must cite verified legal authority separately from factual evidence.
outputs:
- finding
- evidence_gaps
- actions
- contract_effect
contract_effect_candidates:
- conditions_precedent
- closing_mechanics
- post_closing_covenants
human_confirmation_required: true
title_en: Post-Closing / Transition Obligations
title_ru: Обязательства после закрытия и переходный период
role: coverage_obligation
fnm:
  purpose: Resolve whether 'Обязательства после закрытия и переходный период' is satisfactorily established for the applicable deal perimeter;
    translate confirmed legal/factual dependencies into closing or post-closing obligations without choosing commercial remedies automatically.
  failure_modes:
  - unresolved blocker not converted to closing action
  - draft-only assumption treated as signed obligation
  - commercial remedy chosen without human decision
  - silent omission because human checklist order was not followed
  - false clear despite unresolved material evidence
  required_invariant: If material/applicable, 'Обязательства после закрытия и переходный период' must end as supported proposed/final conclusion,
    explicit issue/gap, external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
  constraint_type: INVARIANT
  hard_if_applicable: true
  ai_native_implementation:
  - dependency graph
  - finding→consequence mapping
  - structured handoff
  validators:
  - VAL-CONSEQUENCE-LINK
  - VAL-DRAFT-TRACEABILITY
  - VAL-HUMAN-GATE
  sequence_required: false
  depth: adaptive per runtime/depth_policy.yaml
state_contract:
  agent_status:
  - not_started
  - in_progress
  - clear
  - issue
  - cannot_conclude
  - external_review_required
  - not_applicable
  human_review:
  - pending
  - confirmed
  - modified
  - rejected
  - reconfirmation_required
  final_status_requires_human_confirmation: true
