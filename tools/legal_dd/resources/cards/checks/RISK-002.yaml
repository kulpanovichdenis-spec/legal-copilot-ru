id: RISK-002
title: Споры и оспаривание прав на ИС
module: risk
version: '0.3'
objective: If material/applicable, 'Споры и оспаривание прав на ИС' must end as supported proposed/final conclusion, explicit issue/gap, external_review_required,
  or reasoned not_applicable; it may not silently disappear from scope.
applicability_key: any_ip_in_scope
evidence_requirements:
- ER-IP-006
- ER-IP-014
- ER-RISK-002
rules:
- Do not set clear while any mandatory evidence requirement is missing, partial, invalid, outdated or conflicting.
- Every material factual proposition must resolve to one or more facts with exact source locators.
- Legal conclusions must cite verified legal authority separately from factual evidence.
outputs:
- finding
- evidence_gaps
- actions
- contract_effect
contract_effect_candidates:
- disclosure
- representations
- indemnity
- conditions_precedent
human_confirmation_required: true
title_en: IP Disputes / Challenges / Administrative Proceedings
title_ru: Споры и оспаривание прав на ИС
role: coverage_obligation
fnm:
  purpose: Resolve whether 'Споры и оспаривание прав на ИС' is satisfactorily established for the applicable deal perimeter; identify material
    disputes, enforcement or compliance facts that affect value, transferability, continuity or transaction execution.
  failure_modes:
  - material exposure omitted
  - seller statement treated as independent verification
  - risk not linked to transaction consequence
  - silent omission because human checklist order was not followed
  - false clear despite unresolved material evidence
  required_invariant: If material/applicable, 'Споры и оспаривание прав на ИС' must end as supported proposed/final conclusion, explicit issue/gap,
    external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
