id: REG-009
title: Качество продукта, стабильность и серии
module: regulatory
version: '0.3'
objective: If material/applicable, 'Качество продукта, стабильность и серии' must end as supported proposed/final conclusion, explicit issue/gap,
  external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
applicability_key: physical_product
evidence_requirements:
- ER-REG-004
- ER-REG-012
- ER-MFG-004
- ER-MFG-010
rules:
- Do not set clear while any mandatory evidence requirement is missing, partial, invalid, outdated or conflicting.
- Every material factual proposition must resolve to one or more facts with exact source locators.
- Legal conclusions must cite verified legal authority separately from factual evidence.
outputs:
- finding
- evidence_gaps
- actions
- contract_effect
contract_effect_candidates:
- representations
- covenants
- conditions_precedent
human_confirmation_required: true
title_en: Product Quality / Stability / Series Evidence
title_ru: Качество продукта, стабильность и серии
role: coverage_obligation
fnm:
  purpose: Resolve whether 'Качество продукта, стабильность и серии' is satisfactorily established for the applicable deal perimeter; establish
    whether regulatory status, dossier and ongoing obligations support lawful transfer/continuation of the product in scope.
  failure_modes:
  - false assumption of current registration/status
  - missing lifecycle obligation
  - dossier/label/manufacturer mismatch
  - silent omission because human checklist order was not followed
  - false clear despite unresolved material evidence
  required_invariant: If material/applicable, 'Качество продукта, стабильность и серии' must end as supported proposed/final conclusion, explicit
    issue/gap, external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
  constraint_type: INVARIANT
  hard_if_applicable: false
  ai_native_implementation:
  - evidence graph
  - official-source retrieval
  - temporal/jurisdiction validation
  - dossier coverage graph
  validators:
  - VAL-EVIDENCE-SUFFICIENCY
  - VAL-FACT-PROVENANCE
  - VAL-LEGAL-AUTHORITY
  - VAL-DOSSIER-COVERAGE
  sequence_required: false
  depth: adaptive per runtime/depth_policy.yaml
state_contract:
  agent_status:
  - not_started
  - in_progress
  - clear
  - issue
  - cannot_conclude
  - external_review_required
  - not_applicable
  human_review:
  - pending
  - confirmed
  - modified
  - rejected
  - reconfirmation_required
  final_status_requires_human_confirmation: true
