id: TX-005
title: Перечень и полнота активов
module: transaction
version: '0.3'
objective: If material/applicable, 'Перечень и полнота активов' must end as supported proposed/final conclusion, explicit issue/gap, external_review_required,
  or reasoned not_applicable; it may not silently disappear from scope.
applicability_key: asset_or_mixed_or_product_perimeter
evidence_requirements:
- ER-TX-003
- ER-MFG-010
- ER-SHARE-001
rules:
- Do not set clear while any mandatory evidence requirement is missing, partial, invalid, outdated or conflicting.
- Every material factual proposition must resolve to one or more facts with exact source locators.
- Legal conclusions must cite verified legal authority separately from factual evidence.
outputs:
- finding
- evidence_gaps
- actions
- contract_effect
contract_effect_candidates:
- agreement_structure
- schedules
human_confirmation_required: true
title_en: Asset Inventory and Completeness
title_ru: Перечень и полнота активов
role: coverage_obligation
fnm:
  purpose: Resolve whether 'Перечень и полнота активов' is satisfactorily established for the applicable deal perimeter; establish the transaction
    perimeter, roles, transfer structure and dependencies needed by all downstream analysis.
  failure_modes:
  - material perimeter omission
  - wrong party/role/asset linkage
  - downstream analysis built on unresolved transaction structure
  - silent omission because human checklist order was not followed
  - false clear despite unresolved material evidence
  required_invariant: If material/applicable, 'Перечень и полнота активов' must end as supported proposed/final conclusion, explicit issue/gap,
    external_review_required, or reasoned not_applicable; it may not silently disappear from scope.
  constraint_type: INVARIANT
  hard_if_applicable: false
  ai_native_implementation:
  - entity/asset graph
  - applicability routing
  - consistency validation
  validators:
  - VAL-SCOPE-COVERAGE
  - VAL-ROUTING-INPUTS
  - VAL-CONFLICTS
  sequence_required: false
  depth: adaptive per runtime/depth_policy.yaml
state_contract:
  agent_status:
  - not_started
  - in_progress
  - clear
  - issue
  - cannot_conclude
  - external_review_required
  - not_applicable
  human_review:
  - pending
  - confirmed
  - modified
  - rejected
  - reconfirmation_required
  final_status_requires_human_confirmation: true
