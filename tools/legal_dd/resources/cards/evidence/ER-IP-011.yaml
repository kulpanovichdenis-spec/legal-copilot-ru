id: ER-IP-011
title: Документы по служебным РИД
module: ip
applies_when: IP created by employees or service inventors/authors
requested_from: seller/right_holder
evidence_types:
- employment_agreements
- job_descriptions
- service_assignments
- author_notifications
- remuneration_evidence
sufficient_if:
- service nature, employer title steps and applicable author remuneration are evidenced
mapped_checks:
- IP-EMP-009
- IP-PAT-006
- IP-CR-008
- IP-DOC-001
extractor_ids:
- EXT-IP-021
request_text: 'Предоставить документы по служебным РИД: трудовые функции/задания, уведомления, решения работодателя и документы о вознаграждении.'
gap_text: Не подтверждены основания возникновения прав работодателя и/или исполнение обязательств перед автором.
external_verification: false
derived_requirement: false
freshness: null
notes: null
human_confirmation_required: true
review_scope:
  mode: exhaustive
activation_checks:
- IP-EMP-009
request_phase: conditional
title_en: Employee/service IP evidence
title_ru: Документы по служебным РИД
role: evidence_sufficiency_contract
evidence_types_are_examples: true
functional_equivalent_evidence_allowed: true
request_only_if_unresolved: true
fnm:
  purpose: Establish the facts needed to resolve linked coverage obligations; obtaining a specifically named document is not the objective unless
    law/transaction makes form/source mandatory.
  failure_modes:
  - document-name ritual without required facts
  - file presence treated as sufficiency
  - equivalent reliable evidence ignored
  - gap silently converted to clear
  required_invariant: Requirement is satisfied only when its sufficiency rule is met with traceable evidence; otherwise status remains explicit.
  constraint_type: INVARIANT
  ai_native_implementation:
  - fact-oriented sufficiency rule
  - many-to-many evidence graph
  - dynamic request/gap generation
  validator:
  - VAL-EVIDENCE-SUFFICIENCY
  - VAL-FACT-PROVENANCE
  eval: Equivalent evidence may satisfy the functional fact requirement; missing material fact may not.
