title_ru: Действующее РУ / регистрация и официальный статус
role: evidence_sufficiency_contract
evidence_types_are_examples: true
functional_equivalent_evidence_allowed: true
request_only_if_unresolved: true
fnm:
  purpose: Establish the facts needed to resolve linked coverage obligations; obtaining a specifically named document is not the objective unless
    law/transaction makes form/source mandatory.
  failure_modes:
  - document-name ritual without required facts
  - file presence treated as sufficiency
  - equivalent reliable evidence ignored
  - gap silently converted to clear
  required_invariant: Requirement is satisfied only when its sufficiency rule is met with traceable evidence; otherwise status remains explicit.
  constraint_type: INVARIANT
  ai_native_implementation:
  - fact-oriented sufficiency rule
  - many-to-many evidence graph
  - dynamic request/gap generation
  validator:
  - VAL-EVIDENCE-SUFFICIENCY
  - VAL-FACT-PROVENANCE
  eval: Equivalent evidence may satisfy the functional fact requirement; missing material fact may not.
