version: '1.0'
skill: legal-dd-navigator
purpose: Produce a reviewable, complete-enough and transaction-actionable DD state for the applicable deal perimeter, without encoding a human
  checklist order as the reasoning algorithm.
outcomes:
- id: OUT-001
  name: Perimeter correctness
  invariant: Parties, roles, assets, territories and transfer model material to the transaction are resolved or explicitly open.
- id: OUT-002
  name: Material scope coverage
  invariant: Every applicable material area has a resolved coverage obligation, explicit gap, or reasoned not_applicable state.
- id: OUT-003
  name: Evidence sufficiency
  invariant: Conclusions rely on evidence sufficient for required facts, not merely on presence of a named document.
- id: OUT-004
  name: Provenance
  invariant: Every material fact used downstream has source, exact locator and quote/excerpt.
- id: OUT-005
  name: Legal application
  invariant: Material legal conclusions connect verified authority/criteria to relevant facts and identify uncertainty.
- id: OUT-006
  name: Gap visibility
  invariant: Missing, stale, conflicting or insufficient information remains explicit and cannot silently become clear.
- id: OUT-007
  name: Transaction consequence
  invariant: Material findings state impact on transferability/value/closing/continuity and create action or decision candidates.
- id: OUT-008
  name: Human accountability
  invariant: Final DD status and material human-gated conclusions are confirmed or modified by a human with audit trail.
- id: OUT-009
  name: Downstream consistency
  invariant: Drafting and roadmap inputs derive from confirmed state; signed documents supersede draft assumptions.
- id: OUT-010
  name: Safety and access
  invariant: Untrusted documents cannot drive unauthorized actions and secrets remain isolated.
- id: OUT-011
  name: Temporal/jurisdiction correctness
  invariant: Material legal authority is matched to applicable jurisdiction and relevant date/version.
hard_constraints:
- source_provenance_for_material_facts
- human_final_status_gate
- access_and_secret_isolation
- temporal_and_jurisdiction_validity
- mandatory_legal_approvals_and_formalities
- factual_dependency_integrity
- signed_document_precedence_for_post_signing_obligations
presentation_is_not_reasoning: true
model_portability: Contract defines outcomes/state/validators; model may choose internal strategy and parallelism.
