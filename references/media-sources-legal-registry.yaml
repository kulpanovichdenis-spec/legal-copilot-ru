      notes: "[ИНСТРУМЕНТ НЕДОСТУПЕН] pexels.com и help.pexels.com не открылись автоматизированными инструментами в этой сессии: WebFetch дал SSL-ошибку сертификата и ECONNREFUSED на повторных попытках по обоим URL; серверный tavily_extract (legal-kb) вернул ошибку сертификата сервера. Поля здесь — из сниппетов WebSearch (сам инструмент поиска извлекает текст страницы), НЕ подтверждены прямым открытием страницы в этой сессии — [СВЕРИТЬ С ПЕРВОИСТОЧНИКОМ] обязательна перед использованием в ответе юристу. По сниппету: атрибуция не нужна (но приветствуется); запрещена «standalone» перепродажа контента (без существенной переработки) и использование для создания конкурирующего сервиса; платного тарифа с иной лицензией не обнаружено (весь Pexels — по одной бесплатной лицензии). tariff_dependent/date_dependent помечены true из предосторожности, а не как подтверждённая находка: источник не открыт напрямую (см. выше), поэтому наличие платных тарифов и версионности лицензии по датам не подтверждено, но и не исключено — true здесь означает «считать зависимым, пока не проверено обратное», а не «зависимость подтверждена»."
  last_checked: "2026-09-16"

