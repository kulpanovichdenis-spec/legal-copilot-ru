- provider: "Getty Images / iStock"
  products:
    - product: "Getty Images Content License Agreement (RF / RM / Editorial)"
      official_domain: "gettyimages.com"
      terms_url: "https://www.gettyimages.com/eula"
      license_url: "https://www.gettyimages.com/faq/licensing"
      ai_terms_url: null
      content_policy_url: "https://www.gettyimages.com/eula"
      historical_revisions_url: null
      checks_required:
        attribution: conditional
        provenance_or_ai_disclosure: not_identified
        tariff_dependent: true
        date_dependent: true
        model_dependent: false
      notes: "gettyimages.com/eula автоматически 302-редиректит на gettyimages.de/eula (тот же документ, локаль по IP) — открыт и прочитан. Editorial-контент требует атрибуции у фото рядом с изображением и запрещён к коммерческому использованию без доп. лицензии (нет model/property release). RF — единая оплата, безлимитное использование по размеру файла; RM/RR — зависит от тиража/территории/срока. Прямой запрет использования контента для обучения ML/AI-моделей без отдельного письменного разрешения (искл. — ограниченная внутренняя индексация неredakционного контента). Страница истории редакций не обнаружена в ходе поиска — не значит, что её нет."
    - product: "iStock Content License Agreement (Standard / Extended)"
      official_domain: "istockphoto.com"
      terms_url: "https://www.istockphoto.com/legal/license-agreement"
      license_url: "https://www.istockphoto.com/legal/license-agreement"
      ai_terms_url: null
      content_policy_url: null
      historical_revisions_url: null
      checks_required:
        attribution: conditional
        provenance_or_ai_disclosure: conditional
        tariff_dependent: true
        date_dependent: true
        model_dependent: false
      notes: "istockphoto.com/legal/license-agreement открыт и прочитан. Атрибуция не нужна для коммерческого фото, но обязательна для editorial («iStock.com/[имя автора]») и для AI-генерированного контента (указывать «iStock AI Generator» как автора — это отдельная AI-подписка, не входит в этот продукт). Standard запрещает продукты, где стоимость определяется преимущественно лицензированным контентом; Extended даёт лимиты по категориям (до 100 000 открыток/наклеек, 10 000 постеров/календарей, 2 000 предметов одежды) и безлимит для digital-продуктов/шаблонов. Прямой запрет использования для машинного обучения/ИИ без отдельного разрешения."
  last_checked: "2026-09-16"

