# media-sources-legal-registry.yaml
#
# Навигационный реестр сервисов для skill image-video-rights-check.
# НЕ ЯВЛЯЕТСЯ юридическим заключением. Любое поле здесь — указатель,
# где искать и что проверить у официального источника перед выводом,
# а не готовое правовое основание. Перед ответом юристу агент обязан
# открыть terms_url / license_url / ai_terms_url текущей версии и
# сверить факты заново (references/media-rights-methodology.md).
#
# Схема записи:
#   provider: строка
#   products:
#     - product: строка (конкретный продукт/функция/модель!)
#       official_domain: строка
#       terms_url: строка | null
#       license_url: строка | null
#       ai_terms_url: строка | null       # только для AI-продуктов
#       content_policy_url: строка | null
#       historical_revisions_url: строка | null
#       checks_required:
#         attribution: required|conditional|not_required|not_identified|unclear
#         provenance_or_ai_disclosure: required|conditional|not_required|not_applicable|not_identified
#         tariff_dependent: true|false
#         date_dependent: true|false
#         model_dependent: true|false      # агрегаторы / несколько моделей на выбор
#       notes: строка (короткая навигационная заметка, НЕ юридический вывод)
#   last_checked: "YYYY-MM-DD"
#
# Историческая заметка к структуре записей ниже: «Freepik / Envato Elements»
# и «Getty Images / iStock» — в реальности два разных сервиса каждый (разные
# официальные домены и разные тексты лицензий; для Getty Images/iStock — у
# одной компании Getty Images, Inc.). Чтобы не смешивать разные по доменам/
# условиям сервисы в одну исследовательскую единицу и одновременно не плодить
# лишние записи верхнего уровня `provider`, оба случая объединены в одну
# запись `provider`, но с ДВУМЯ независимыми записями в `products[]` —
# каждая со своим official_domain/terms_url/license_url, исследованная
# отдельно, а не разделены на 4 отдельных provider. Это решение можно
# пересмотреть — см. git-историю файла для обоснования.

- provider: "Shutterstock"
  products:
    - product: "Standard Image/Video License"
      official_domain: "shutterstock.com"
      terms_url: "https://www.shutterstock.com/license"
      license_url: "https://www.shutterstock.com/license-comparison"
      ai_terms_url: null
      content_policy_url: "https://submit.shutterstock.com/help/en/articles/10594649-how-can-customers-use-images-and-videos-they-download"
      historical_revisions_url: "https://www.shutterstock.com/license-history"
      checks_required:
        attribution: not_identified
        provenance_or_ai_disclosure: not_identified
        tariff_dependent: true
        date_dependent: true
        model_dependent: false
      notes: "[ИНСТРУМЕНТ НЕДОСТУПЕН] shutterstock.com/license, /license-comparison и help-статьи на www.shutterstock.com вернули автоматизированному WebFetch 403 (антибот-защита); контент подтверждён через открывшуюся страницу submit.shutterstock.com того же провайдера — это вторичный по иерархии источников домен (не сама страница license/license-comparison), [СВЕРИТЬ С ПЕРВОИСТОЧНИКОМ] обязательна перед использованием в ответе юристу. Standard ограничивает тираж/показы и запрещает мерч; коммерческое использование редакционного (editorial) контента запрещено; лого/товарные знаки — запрещены."
    - product: "Enhanced Image/Video License"
      official_domain: "shutterstock.com"
      terms_url: "https://www.shutterstock.com/license"
      license_url: "https://www.shutterstock.com/license-comparison"
      ai_terms_url: null
      content_policy_url: "https://submit.shutterstock.com/help/en/articles/10594649-how-can-customers-use-images-and-videos-they-download"
      historical_revisions_url: "https://www.shutterstock.com/license-history"
      checks_required:
        attribution: not_identified
        provenance_or_ai_disclosure: not_identified
        tariff_dependent: true
        date_dependent: true
        model_dependent: false
      notes: "Снимает лимит тиража/показов/бюджета Standard-лицензии, разрешает мерч для продажи и постерное искусство; повышенная индемнификация (до $250K против $10K у Standard). Не покрывает лого/товарные знаки и sensitive-темы. Источники — см. Standard License выше (тот же документ регулирует оба уровня); [ИНСТРУМЕНТ НЕДОСТУПЕН] тот же документ получен через вторичный домен submit.shutterstock.com после 403 на основных страницах shutterstock.com — [СВЕРИТЬ С ПЕРВОИСТОЧНИКОМ]."
  last_checked: "2026-09-16"

