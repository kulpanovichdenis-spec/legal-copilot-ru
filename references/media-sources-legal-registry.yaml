    - product: "Envato Elements License"
      official_domain: "elements.envato.com"
      terms_url: "https://help.elements.envato.com/hc/en-us/articles/360000629006-Envato-Elements-User-Terms"
      license_url: "https://help.elements.envato.com/hc/en-us/articles/360000629206-Envato-Full-License-Wording"
      ai_terms_url: null
      content_policy_url: "https://help.elements.envato.com/hc/en-us/articles/360000621783-Correct-Usage-of-Items"
