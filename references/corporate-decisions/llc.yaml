  - decision_id: capital_decrease
    title: Уменьшение уставного капитала
    synonyms: [уменьшить уставный капитал, погасить долю общества, уменьшение номинальной стоимости долей]
    organs_by_law: Общее собрание участников (ст. 33 п. 2 пп. 2 — изменение размера уставного капитала); передача совету директоров или коллегиальному исполнительному органу уставом не допускается (ст. 33 п. 2, последний абзац). Уменьшение возможно путем уменьшения номинальной стоимости долей всех участников с сохранением размеров долей и (или) погашения долей общества (ст. 20 п. 1).
    majority_by_law: Не менее 2/3 голосов от общего числа голосов участников как по вопросу ст. 33 п. 2 пп. 2, если законом или уставом не предусмотрено большее (ст. 37 п. 7 абз. 1); специальное большинство в открытых абзацах ст. 20 не найдено.
    confirmation: Общее правило — нотариальное удостоверение, если иной способ не предусмотрен уставом или единогласным решением (ГК РФ ст. 67.1 п. 3 пп. 3); специальное правило о нотариальном удостоверении в открытых абзацах ст. 20 не найдено. После решения — сообщение в регистрирующий орган в течение 3 рабочих дней и двукратная публикация уведомления (ст. 20 п. 3).
    sole_member: Решает единственный участник единолично письменно (ст. 39); обязанность сообщения и публикации по ст. 20 п. 3 применяется к обществу.
