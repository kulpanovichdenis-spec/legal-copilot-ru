  - decision_id: major_transaction
    title: Согласие на крупную сделку
    synonyms: [одобрить крупную сделку, крупная сделка 25 процентов, согласие участников на сделку]
    organs_by_law: Общее собрание участников (ст. 46 п. 3 абз. 1). При наличии совета директоров уставом можно отнести к его компетенции сделки с имуществом от 25 до 50 процентов стоимости имущества (ст. 46 п. 3 абз. 2); сделки свыше 50 процентов совету не передаются, коллегиальному исполнительному органу — никакие (ст. 33 п. 2, последний абзац). Крупная — сделка за пределами обычной хозяйственной деятельности с имуществом от 25 процентов балансовой стоимости активов, в том числе заем, кредит, залог, поручительство (ст. 46 п. 1).
    majority_by_law: В открытых абзацах ст. 46 специального большинства не найдено; по общему правилу — большинство голосов от общего числа голосов участников, если законом или уставом не предусмотрено большее (ст. 37 п. 7 абз. 3).
    confirmation: Нотариальное удостоверение решения собрания, если иной способ не предусмотрен уставом или единогласным решением (ГК РФ ст. 67.1 п. 3 пп. 3). В решении указываются стороны, выгодоприобретатель, цена, предмет и иные существенные условия (ст. 46 п. 3); допустимо заключение под отлагательным условием получения согласия (ст. 46 п. 3).
    sole_member: Статья 46 не применяется, если единственный участник одновременно является единственным лицом с полномочиями ЕИО (ст. 46 п. 7).
