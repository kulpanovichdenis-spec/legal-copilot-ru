    title: Размещение облигаций и иных эмиссионных ценных бумаг
    synonyms: [выпустить облигации, эмиссия облигаций ООО]
    organs_by_law: Общее собрание участников (ст. 33 п. 2 пп. 9); пп. 9 не входит в перечень вопросов, которые нельзя передать совету директоров, но коллегиальному исполнительному органу передать нельзя (ст. 33 п. 2, последний абзац). Выпуск облигаций — после полной оплаты уставного капитала (ст. 31 п. 2).
    majority_by_law: Большинство голосов от общего числа голосов участников, если законом или уставом не предусмотрено большее (ст. 37 п. 7 абз. 3).
    confirmation: Нотариальное удостоверение, если иной способ не предусмотрен уставом или единогласным решением (ГК РФ ст. 67.1 п. 3 пп. 3).
    sole_member: Решает единственный участник единолично письменно (ст. 39).
