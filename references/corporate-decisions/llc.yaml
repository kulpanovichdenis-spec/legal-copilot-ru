  - decision_id: charter_amendment
    title: Изменение устава, новая редакция устава, переход на типовой устав
    synonyms: [внести изменения в устав, утвердить устав в новой редакции, перейти на типовой устав, сменить наименование или место нахождения]
    organs_by_law: Общее собрание участников (ст. 33 п. 2 пп. 2). Передать вопрос совету директоров или коллегиальному исполнительному органу уставом нельзя (ст. 33 п. 2, последний абзац).
    majority_by_law: Не менее 2/3 голосов от общего числа голосов участников, если законом или уставом не предусмотрено большее число (ст. 37 п. 7 абз. 1). Отдельные положения устава вносятся, меняются и исключаются только единогласно всеми участниками (напр. ст. 27 п. 1 и п. 2, ст. 28 п. 2, ст. 32 п. 1, ст. 33 п. 2 последний абзац).
    confirmation: Нотариальное удостоверение, если иной способ не предусмотрен уставом либо единогласным решением общего собрания (ГК РФ ст. 67.1 п. 3 пп. 3).
    sole_member: Решает единственный участник единолично, решение оформляется письменно; нотариальное удостоверение — в случаях, предусмотренных федеральным законом; ст. 34–38 и 43 не применяются, кроме сроков очередного собрания (ст. 39).
