  - decision_id: loan
    title: Заем, кредит (получение и выдача)
    synonyms: [взять кредит, выдать заем, договор займа, кредитный договор, кто одобряет заем]
    organs_by_law: Самостоятельного правила о займах в открытом тексте нет. ЕИО без доверенности совершает сделки и осуществляет полномочия, не отнесенные законом или уставом к ОСУ, СД и КИО (ст. 40 п. 3 пп. 1, пп. 4). Устав может требовать согласия СД или ОСУ на определенные сделки (ст. 40 п. 3.1). Заем и кредит прямо названы среди сделок, которые могут быть крупными (ст. 46 п. 1) — тогда согласие ОСУ или СД (ст. 46 п. 3); при заинтересованности — ст. 45.
    majority_by_law: По закону не установлено для займа как такового. Если заем — крупная сделка, см. major_transaction; если сделка с заинтересованностью — большинство незаинтересованных (ст. 45 п. 4); если согласие требует устав — по уставу.
    confirmation: Специального способа для займа нет; решение собрания (если требуется) — по ГК РФ ст. 67.1 п. 3 пп. 3. Сделка без предусмотренного уставом согласия оспорима по ГК РФ ст. 174 п. 1 (ст. 40 п. 3.1).
    sole_member: Правила о крупных сделках и сделках с заинтересованностью не применяются, если единственный участник одновременно является единственным лицом с полномочиями ЕИО (ст. 45 п. 7; ст. 46 п. 7).
