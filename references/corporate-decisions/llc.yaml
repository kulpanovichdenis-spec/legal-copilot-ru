  - decision_id: auditor_appointment
    title: Решение о проведении аудита и назначение аудитора
    synonyms: [назначить аудитора, утвердить аудиторскую организацию, оплата услуг аудитора, обязательный аудит]
    organs_by_law: Общее собрание участников (ст. 33 п. 2 пп. 10); уставом может быть отнесено к компетенции совета директоров (ст. 32 п. 2.1 пп. 5), коллегиальному исполнительному органу передать нельзя (ст. 33 п. 2, последний абзац). При обязательном аудите общество обязано привлечь независимую аудиторскую организацию (ст. 48 п. 2). Аудит по требованию любого участника — за его счет, расходы могут быть возмещены по решению общего собрания (ст. 48 п. 3; этот пункт не передается совету и КИО — ст. 33 п. 2, последний абзац).
