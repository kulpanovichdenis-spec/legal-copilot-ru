  - decision_id: meeting_procedure_approval
    title: Порядок проведения общего собрания (регламент, отличия в уставе)
    synonyms: [регламент собрания, утвердить порядок проведения собрания, положение об общем собрании, заочное голосование по уставу]
    organs_by_law: Заседание проводится по закону, уставу и внутренним документам; в неурегулированной части порядок устанавливается решением общего собрания (ст. 37 п. 1). Отличные от закона положения о подготовке, проведении и принятии решений можно включить в устав при учреждении либо внести, изменить или исключить единогласным решением всех участников (ст. 32 п. 1).
    majority_by_law: Положения устава об ином порядке — единогласно всеми участниками (ст. 32 п. 1); решение о порядке в неурегулированной части — по общему правилу большинством голосов от общего числа голосов участников (ст. 37 п. 7 абз. 3). Решения принимаются открытым голосованием, если устав не предусматривает иное (ст. 37 п. 9).
    confirmation: Нотариальное удостоверение, если иной способ не предусмотрен уставом или единогласным решением (ГК РФ ст. 67.1 п. 3 пп. 3).
    sole_member: Статьи 34–38 и 43 не применяются, кроме положений о сроках очередного собрания (ст. 39).
