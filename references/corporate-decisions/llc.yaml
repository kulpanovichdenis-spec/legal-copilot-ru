  - decision_id: capital_increase
    title: Увеличение уставного капитала
    synonyms: [увеличить уставный капитал, дополнительные вклады участников, увеличение УК за счет имущества, вклад третьего лица в УК]
    organs_by_law: Общее собрание участников (ст. 33 п. 2 пп. 2 — изменение размера уставного капитала); передача совету директоров или коллегиальному исполнительному органу уставом не допускается (ст. 33 п. 2, последний абзац). Увеличение допускается только после полной оплаты уставного капитала (ст. 17 п. 1).
    majority_by_law: За счет имущества общества — не менее 2/3 голосов от общего числа голосов участников, если устав не требует большего (ст. 18 п. 1). За счет дополнительных вкладов всех участников — не менее 2/3, если устав не требует большего (ст. 19 п. 1). На основании заявления участника о дополнительном вкладе или заявления третьего лица о принятии в общество — всеми участниками единогласно (ст. 19 п. 2).
    confirmation: Нотариальное удостоверение факта принятия решения и состава присутствовавших участников, а также решения единственного участника (ст. 17 п. 3).
    sole_member: Решение единственного участника об увеличении уставного капитала подлежит нотариальному удостоверению (ст. 17 п. 3; ст. 39).
