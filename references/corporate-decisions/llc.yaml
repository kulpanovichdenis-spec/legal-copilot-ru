  - decision_id: interested_party_transaction
    title: Согласие на сделку с заинтересованностью
    synonyms: [сделка с заинтересованностью, одобрить сделку с аффилированным лицом, сделка с директором]
    organs_by_law: Обязательного предварительного согласия не требуется (ст. 45 п. 4 абз. 1). Согласие может быть получено по требованию ЕИО, члена КИО, члена СД или участников с долями не менее 1 процента — от совета директоров или общего собрания (ст. 45 п. 4). Заинтересованные лица доводят информацию до общего собрания, а при наличии СД — и до совета (ст. 45 п. 2); извещение о сделке направляется не позднее чем за 15 дней до ее совершения, если иной срок не предусмотрен уставом (ст. 45).
    majority_by_law: Совет директоров — большинство голосов незаинтересованных директоров; общее собрание — большинство голосов от общего числа голосов незаинтересованных участников; устав может требовать большего (ст. 45 п. 4).
    confirmation: К решению применяется ст. 46 п. 3 и указываются заинтересованные лица и основания (ст. 45 п. 5); решение собрания — по ГК РФ ст. 67.1 п. 3 пп. 3.
    sole_member: Статья 45 не применяется, если единственный участник одновременно является единственным лицом с полномочиями ЕИО (ст. 45 п. 7).
