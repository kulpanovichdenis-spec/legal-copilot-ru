  - decision_id: participation_in_other_companies
    title: Участие в других организациях и объединениях
    synonyms: [создать ассоциацию, вступить в союз, участие в других обществах, создать дочернее общество, выйти из ассоциации]
    organs_by_law: Создание ассоциаций (союзов) и иных объединений, участие и прекращение участия в них — общее собрание участников (ст. 33 п. 2 пп. 1); эта часть пп. 1 не входит в перечни запретов на передачу совету и коллегиальному исполнительному органу (ст. 33 п. 2, последний абзац). Отдельного правила об участии в коммерческих обществах в открытом тексте нет — по общему правилу полномочие ЕИО (ст. 40 п. 3 пп. 4), если устав не относит его к другим органам; сделка может оказаться крупной или с заинтересованностью (ст. 46, ст. 45).
    majority_by_law: Для пп. 1 — большинство голосов от общего числа голосов участников, если законом или уставом не предусмотрено большее (ст. 37 п. 7 абз. 3).
    confirmation: Решение собрания — нотариальное удостоверение, если иной способ не предусмотрен уставом или единогласным решением (ГК РФ ст. 67.1 п. 3 пп. 3).
    sole_member: Решения по пп. 1 принимает единственный участник единолично письменно (ст. 39).
