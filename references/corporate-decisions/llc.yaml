  - decision_id: board_formation
    title: Образование совета директоров и вознаграждение его членов
    synonyms: [создать совет директоров, наблюдательный совет, избрать членов совета директоров, вознаграждение членам СД]
    organs_by_law: Совет директоров образуется, если это предусмотрено уставом; порядок образования, деятельности и прекращения полномочий членов определяется уставом (ст. 32 п. 2). Вознаграждение и компенсации членам совета и их размер устанавливает общее собрание участников (ст. 32 п. 2). Абзац пятый п. 2 ст. 32 исключен из передачи совету и КИО (ст. 33 п. 2, последний абзац); какому абзацу соответствует вознаграждение — сверить юристу.
    majority_by_law: Специального большинства для избрания членов совета в открытых абзацах не найдено; по общему правилу — большинство голосов от общего числа голосов участников (ст. 37 п. 7 абз. 3). Уставом может быть предусмотрено кумулятивное голосование (ст. 37 п. 8).
    confirmation: Нотариальное удостоверение, если иной способ не предусмотрен уставом или единогласным решением (ГК РФ ст. 67.1 п. 3 пп. 3).
    sole_member: Решает единственный участник единолично письменно (ст. 39). ЕИО и члены КИО не могут составлять более 1/4 состава совета и быть его председателем (ст. 32 п. 2).
