    organs_by_law: Общее собрание участников, если уставом образование ЕИО не отнесено к компетенции совета директоров (ст. 33 п. 2 пп. 4; ст. 40 п. 1). Коллегиальному исполнительному органу передать нельзя (ст. 33 п. 2, последний абзац). ЕИО — только физическое лицо, кроме случая управляющего (ст. 40 п. 2).
